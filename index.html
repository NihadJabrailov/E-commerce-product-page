<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="navbarContainer"> <!--navbar üçün main container-->

        <div class="navbarLeft"> <!--navbardakı logoların sol tərəfi-->
            <button id="menuButton" class="menuToggle" aria-label="Open Menu">
                <img src="./images/icon-menu.svg" alt="Menu Icon">
            </button>
            <img src="./images/logo.svg" alt="Logo">
        </div>

        <div class="navbarRight"> <!--navbardakı sebet ve avatarın sağ tərəfi-->
            <button id="cartButton" class="menuToggle" aria-label="Open Menu">
                <img src="./images/icon-cart.svg" alt="Cart Icon">
            </button>
            <button class="menuToggle" aria-label="Open Menu">
                <img class="avatar" src="./images/image-avatar.png" alt="Avatar">
            </button>
        </div>

    </section>

    <section id="cartContainer" class="cartContainer"> <!--kartin oldugu hisse-->
        <div class="cartTopContainer"> <!--kartin yuxari hissesi-->
            <h1 class="saleAndCompanyText" style="color: var(--black);">Cart</h1>
        </div>

        <hr>

        <div class="cartBottomContainer"> <!--Cart dolu və ya boş olarsa bu hissə görünür-->
            <h1 class="saleAndCompanyText" id="emptyCartMessage">Your cart is empty.</h1>
            <!--cart boş olanda bu hissə görünür-->

            <div class="cartRow" id="CartRow"> <!--elementlləri sütun üzrə düzənləyən hisse-->
                <div class="dataCartContainer"> <!--cartda data olarsa görünən hisse-->
                    <img src="./images/image-product-1-thumbnail.jpg" alt="Product Image">
                    <p class="pharagrapfText">Fall Limited Edition Sneakers $125.00 x
                        <span id="productCount" class="pharagrapfText">0</span>
                        <span id="productPrice" class="saleAndCompanyText" style="color: var(--black);">$0.00</span>
                    </p>
                    <button class="deleteButton" id="deleteButton">
                        <img src="./images/icon-delete.svg" alt="Delete Icon">
                    </button>
                </div>

                <div class="checkoutButton"> <!--Checkout düyməsinin olduğu hissə-->
                    <button class="saleAndCompanyText" style="color: var(--black);">Checkout</button>
                </div>
            </div>

        </div>
    </section>


    <section id="slideMenuContainer" class="slideMenuContainer"> <!--sol terefden acilan slide menu containeri-->
        <button id="slideMenuCloseButton" class="slideMenuCloseButton"> <!--slide menu close buttonu-->
            <img src="./images/icon-close.svg" alt="Close Icon">
        </button>

        <div class="slideMenuRow"> <!--linklerin oldugu hisse-->
            <ul>
                <li><a class="slideMenuLink" href="#">Collections</a></li>
                <li><a class="slideMenuLink" href="#">Men</a></li>
                <li><a class="slideMenuLink" href="#">Women</a></li>
                <li><a class="slideMenuLink" href="#">About</a></li>
                <li><a class="slideMenuLink" href="#">Contact</a></li>
            </ul>
        </div>
    </section>




    <script src="script.js"></script>
</body>

</html>
